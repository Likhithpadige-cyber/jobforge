name: jobforge

# Workers are opt-in; ordinary core/full startup remains unchanged.
x-worker: &worker
  build:
    context: .
    dockerfile: infra/docker/Dockerfile.worker
    target: development
  env_file: [.env]
  volumes:
    - ./packages:/app/packages:ro
    - ./workers:/app/workers:ro
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
  stop_grace_period: 40s
  profiles: ["workers"]

x-worker-environment: &worker-environment
  POSTGRES_HOST: postgres
  REDIS_HOST: redis

services:
  postgres:
    # pgvector image, not plain postgres: the Phase 2 schema needs the
    # `vector` extension for profile_facts.embedding (DATABASE_DESIGN.md §4.4).
    image: pgvector/pgvector:pg16
    container_name: jobforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
      POSTGRES_DB: ${POSTGRES_DB:-jobforge}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobforge} -d ${POSTGRES_DB:-jobforge}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    profiles: ["core", "full"]

  redis:
    image: redis:7-alpine
    container_name: jobforge-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy noeviction
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: ["core", "full"]

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
      target: development
    container_name: jobforge-api
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
      - ./workers:/app/workers
      - ./migrations:/app/migrations
      - ./tests:/app/tests
      - ./scripts:/app/scripts
      - ./alembic.ini:/app/alembic.ini
      - ./pyproject.toml:/app/pyproject.toml
      # Read by tests/unit/test_security_fixture_contract.py, which asserts
      # `make test-security` sets REQUIRE_SECURITY_TESTS=1. Read-only: the
      # container never needs to write it.
      - ./Makefile:/app/Makefile:ro
      # Read by scripts/verify_schema.py, which compares the models and the
      # migration against docs/DATABASE_DESIGN.md.
      - ./docs:/app/docs:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    profiles: ["core", "full"]

  worker-outbox:
    <<: *worker
    command: ["python", "-m", "workers.outbox_relay"]
    environment:
      <<: *worker-environment
      WORKER_DATABASE_URL: ${WORKER_AGENT_DATABASE_URL:-}

  worker-first-draft:
    <<: *worker
    command: ["python", "-m", "workers.first_draft"]
    environment:
      <<: *worker-environment
      WORKER_DATABASE_URL: ${WORKER_AGENT_DATABASE_URL:-}

  worker-optimizer:
    <<: *worker
    command: ["python", "-m", "workers.optimizer"]
    environment:
      <<: *worker-environment
      WORKER_DATABASE_URL: ${WORKER_AGENT_DATABASE_URL:-}
      WORKER_PROFILE_ID: ${WORKER_PROFILE_ID:-}

  worker-monitor:
    <<: *worker
    command: ["python", "-m", "workers.monitor"]
    environment:
      <<: *worker-environment
      WORKER_DATABASE_URL: ${WORKER_MONITOR_DATABASE_URL:-}

  worker-scheduler:
    <<: *worker
    command: ["python", "-m", "workers.scheduler"]
    environment:
      <<: *worker-environment
      WORKER_DATABASE_URL: ${WORKER_MONITOR_DATABASE_URL:-}

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      target: development
    container_name: jobforge-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_API_PREFIX: /api/v1
      WATCHPACK_POLLING: "true"
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next
    depends_on:
      api: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    profiles: ["core", "full"]

  minio:
    # quay.io, not docker.io: Docker Hub's minio/minio repository now sits
    # behind a login wall (MinIO's 2024 licensing change), and an anonymous
    # `docker compose --profile full up` must keep working. quay.io/minio/minio
    # is MinIO's own published mirror of the same image.
    #
    # Pinned to a concrete release rather than `latest`, matching how
    # postgres and redis above are pinned: `latest` can move under CI with no
    # diff in this repository to explain a sudden failure, and this service
    # now has a real integration suite (tests/integration/test_s3_artifact_store.py)
    # whose behavior depends on the server it runs against agreeing with the
    # S3 API this adapter expects.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: jobforge-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["full"]

  mailhog:
    image: mailhog/mailhog:latest
    container_name: jobforge-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    profiles: ["full"]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  web_node_modules:
  web_next_cache:
