# Isolated JobForge demo stack. See docs/DEMO_ENVIRONMENT.md.
#
# A separate Compose project with its own containers, ports, volumes and
# credentials. It shares nothing with the development stack (project
# `jobforge`, ports 5432/6379/8000/3000) or any other local stack, and it is
# configured only from the git-ignored `.env.demo`.
#
# Always invoke through the Makefile `demo-*` targets, which pass
# `-p jobforge-demo -f docker-compose.demo.yml --env-file .env.demo`.
name: jobforge-demo

x-app-env: &app-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  REDIS_HOST: redis
  REDIS_PORT: "6379"

x-worker: &worker
  build:
    context: .
    dockerfile: infra/docker/Dockerfile.worker
    target: development
  image: jobforge-demo-worker:local
  env_file: [.env.demo]
  volumes:
    - ./packages:/app/packages:ro
    - ./workers:/app/workers:ro
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
  stop_grace_period: 40s
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jobforge-demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env.demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.demo}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env.demo}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${DEMO_POSTGRES_HOST_PORT:-55433}:5432"
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: jobforge-demo-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:${DEMO_REDIS_HOST_PORT:-56380}:6379"
    volumes:
      - demo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
      target: development
    image: jobforge-demo-api:local
    container_name: jobforge-demo-api
    restart: unless-stopped
    env_file: [.env.demo]
    environment:
      <<: *app-env
    ports:
      - "127.0.0.1:${DEMO_API_HOST_PORT:-8100}:8000"
    volumes:
      - ./apps:/app/apps:ro
      - ./packages:/app/packages:ro
      - ./workers:/app/workers:ro
      - ./migrations:/app/migrations:ro
      - ./scripts:/app/scripts:ro
      - ./alembic.ini:/app/alembic.ini:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      target: development
    image: jobforge-demo-web:local
    container_name: jobforge-demo-web
    restart: unless-stopped
    environment:
      # The browser only ever talks to this origin; the dev server proxies
      # /api/v1 to the demo API container (apps/web/next.config.mjs).
      API_PROXY_TARGET: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:${DEMO_WEB_HOST_PORT:-3100}
      NEXT_PUBLIC_API_PREFIX: /api/v1
      NEXT_PUBLIC_APP_NAME: JobForge Demo
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:${DEMO_WEB_HOST_PORT:-3100}:3000"
    volumes:
      - ./apps/web:/app
      - demo_web_node_modules:/app/node_modules
      - demo_web_next_cache:/app/.next
    depends_on:
      api: {condition: service_healthy}

  # Only the workers monitoring needs. No generation, submission or render
  # worker runs here, so the demo can neither call a model nor send email.
  worker-outbox:
    <<: *worker
    container_name: jobforge-demo-worker-outbox
    command: ["python", "-m", "workers.outbox_relay"]
    environment:
      <<: *app-env
      WORKER_DATABASE_URL: ${DEMO_WORKER_AGENT_DATABASE_URL:?set in .env.demo}

  worker-monitor:
    <<: *worker
    container_name: jobforge-demo-worker-monitor
    command: ["python", "-m", "workers.monitor"]
    environment:
      <<: *app-env
      WORKER_DATABASE_URL: ${DEMO_WORKER_MONITOR_DATABASE_URL:?set in .env.demo}

  worker-scheduler:
    <<: *worker
    container_name: jobforge-demo-worker-scheduler
    command: ["python", "-m", "workers.scheduler"]
    environment:
      <<: *app-env
      WORKER_DATABASE_URL: ${DEMO_WORKER_MONITOR_DATABASE_URL:?set in .env.demo}

volumes:
  demo_postgres_data:
  demo_redis_data:
  demo_web_node_modules:
  demo_web_next_cache:
