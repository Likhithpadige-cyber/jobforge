name: Playwright E2E

# Opt-in to keep the Docker/browser workload out of the fast required checks.
# workflow_dispatch is available once this file exists on the default branch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  LLM_MODE: replay
  SUBMISSION_MODE: dry_run
  EMAIL_TRANSPORT_MODE: fake
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install browser test dependencies
        run: |
          pip install -r requirements-dev.txt
          playwright install --with-deps chromium
          npm ci --prefix apps/web
      - name: Create ephemeral demo configuration
        run: make demo-env
      - name: Start isolated demo services
        run: |
          docker compose -p jobforge-demo -f docker-compose.demo.yml --env-file .env.demo \
            up -d --build --wait postgres redis api web
          make demo-migrate demo-init demo-seed
      - name: Wait for demo sign-in page
        run: |
          for attempt in {1..60}; do
            echo "Waiting for demo sign-in page ($attempt/60)"
            if curl -fsS http://127.0.0.1:3100/login > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Browser journeys (dry-run gate verified by fixtures)
        run: |
          pytest -m e2e tests/e2e/browser --junitxml=test-results/browser.xml
          python scripts/check_test_report.py test-results/browser.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-results
          path: test-results/*.xml
          retention-days: 7
      - name: Remove this runner's demo containers
        if: always()
        run: |
          if test -f .env.demo; then
            docker compose -p jobforge-demo -f docker-compose.demo.yml --env-file .env.demo down -v
          fi
