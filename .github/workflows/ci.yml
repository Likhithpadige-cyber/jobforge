name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  LLM_MODE: replay
  SUBMISSION_MODE: dry_run
  EMAIL_TRANSPORT_MODE: fake
  NEXT_TELEMETRY_DISABLED: "1"

defaults:
  run:
    shell: bash

jobs:
  backend-lint:
    name: Backend lint & types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy apps packages workers
      - name: Schema conformance (models vs migration vs design)
        run: python3 scripts/verify_schema.py
      - name: SQLAlchemy name-shadowing audit
        run: python3 scripts/check_model_shadowing.py
      - name: Down migration is not stale
        run: python3 scripts/gen_down_migration.py --check

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    # The full suite, the separate safety run and API E2E take ~18 min on a
    # hosted runner; 20 left no headroom (one run was cancelled at the limit).
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jobforge
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: jobforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobforge"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ENVIRONMENT: test
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: localdev
      REDIS_HOST: localhost
      APP_AGENT_PASSWORD: app_agent
      APP_API_PASSWORD: app_api
      APP_MONITOR_PASSWORD: app_monitor
      APP_AUDIT_PASSWORD: app_audit
      REQUIRE_SECURITY_TESTS: "1"
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      # MinIO no longer publishes images, so build the pinned release from its
      # verified upstream commit (infra/docker/Dockerfile.minio). The GitHub
      # Actions layer cache means the Go compile runs only when the pin changes.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build isolated CI object storage
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: infra/docker/Dockerfile.minio
          tags: jobforge-ci-minio:local
          load: true
          push: false
          cache-from: type=gha,scope=minio
          cache-to: type=gha,mode=max,scope=minio
      - name: Start isolated CI object storage
        run: |
          docker run -d --name jobforge-ci-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            jobforge-ci-minio:local server /data
          for attempt in {1..30}; do
            echo "Waiting for object storage ($attempt/30)"
            if curl -fsS http://localhost:9000/minio/health/ready; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Apply migrations
        run: alembic upgrade head
      - name: Create role passwords
        run: |
          PGPASSWORD=localdev psql -h localhost -U jobforge -d jobforge -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE app_agent LOGIN PASSWORD 'app_agent';" \
            -c "ALTER ROLE app_api LOGIN PASSWORD 'app_api';" \
            -c "ALTER ROLE app_monitor LOGIN PASSWORD 'app_monitor';" \
            -c "ALTER ROLE app_audit LOGIN PASSWORD 'app_audit';"
      - name: Run tests
        run: pytest --cov --cov-report=xml --junitxml=test-results/backend.xml
      - name: Reject skipped or empty backend runs
        run: python scripts/check_test_report.py test-results/backend.xml
      - name: Offline grounding evaluation (no provider calls)
        run: python scripts/run_offline_evals.py --report .eval-results/offline.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: offline-grounding-evaluation
          path: .eval-results/offline.json
      - name: Security invariants must not be skipped
        run: |
          pytest -m safety --tb=short --junitxml=test-results/safety.xml
          python scripts/check_test_report.py test-results/safety.xml
      - name: API E2E journeys (fake transports, separate process)
        run: |
          pytest -m e2e tests/e2e/test_m13_api_journeys.py --junitxml=test-results/api-e2e.xml
          python scripts/check_test_report.py test-results/api-e2e.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: backend-coverage
          path: |
            coverage.xml
            test-results/*.xml
          retention-days: 7

  frontend:
    name: Frontend lint, types & tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements-dev.txt
      - name: Dependency audit
        run: pip-audit -r requirements-dev.txt
      - name: Secret scan
        # detect-secrets-hook, not `detect-secrets scan`: the latter is the
        # baseline-maintenance command (always rewrites the baseline, always
        # exits 0) and was never actually gating this job. This is the
        # read-only counterpart .pre-commit-config.yaml already uses, and it
        # fails the build on anything not already in .secrets.baseline.
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
      - name: Git history secret scan (Gitleaks)
        # Every reachable commit (checkout uses fetch-depth: 0), with the
        # default rule set plus the single documented exclusion in
        # .gitleaks.toml. The pinned release binary is checksum-verified
        # against the release's own checksum file before it runs.
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check -
          tar -xzf "${archive}" gitleaks
          ./gitleaks git --log-opts="--all" --redact --no-banner --exit-code 1 .
      - name: Assert no CAPTCHA/stealth dependencies
        # SECURITY.md §7.1: the capability must not exist in the codebase.
        run: |
          if grep -niE '2captcha|anticaptcha|capmonster|deathbycaptcha|puppeteer-extra-plugin-stealth|undetected.chromedriver' \
             requirements.txt requirements-dev.txt apps/web/package.json apps/web/package-lock.json; then
            echo "::error::Prohibited CAPTCHA/anti-detection dependency found"
            exit 1
          fi
          echo "no prohibited dependencies found"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: infra/docker/Dockerfile.api
          target: production
          push: false
      - name: Build web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: infra/docker/Dockerfile.web
          target: production
          push: false

  workflows:
    name: Workflow syntax and shell checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check workflows with checksum-verified actionlint
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          curl -fsSLO https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_checksums.txt
          grep ' actionlint_1.7.7_linux_amd64.tar.gz$' actionlint_1.7.7_checksums.txt | sha256sum -c -
          tar -xzf actionlint_1.7.7_linux_amd64.tar.gz actionlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint" -color
